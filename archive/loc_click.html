<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PDF Click Logger</title>
  <style>
    body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; }
    #left-panel { width: 300px; align-items: center; padding: 8px; }
    #center-panel {flex: 1; display: flex; flex-direction: column; align-items: center; }
    #pdf-canvas { border: 1px solid #ccc; max-width: 100%; cursor: crosshair; }
    #controls { margin-bottom: 8px; }
    #log { width: 300px; overflow:auto; font-family: monospace; background: #111; color: #0f0; padding: 8px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

  <div id="left-panel">
    <div id="controls">
      <input type="file" id="pdf-file" accept="application/pdf">
      <br>
      <br>
      <button id="prev-page">Previous</button>
      <span id="page-info">Page: 1 / 1</span>
      <button id="next-page">Next</button>
    </div>
  </div>  
  <div id="center-panel">
    <canvas id="pdf-canvas"></canvas>
  </div>

  <div id="log"></div>

  <script>
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const logEl = document.getElementById('log');
    let pdfDoc = null;
    let scale = 1.5;
    let currentPage = 1;
    let totalPages = 1;

    function log(msg) {
      logEl.innerText = msg + '\n' + logEl.innerText;
    }

    document.getElementById('pdf-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const arrayBuffer = await file.arrayBuffer();
      const uint8 = new Uint8Array(arrayBuffer);

      pdfDoc = await pdfjsLib.getDocument({ data: uint8 }).promise;
      totalPages = pdfDoc.numPages;
      currentPage = 1;
      await renderPage(currentPage);
      log(`PDF loaded: ${file.name}, ${totalPages} page(s)`);
    });


    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

    // Ask the user for input
      const userInput = prompt('Enter text for this location:');
      if (userInput !== null) {  // only log if user didn't cancel
        log(`Clicked at: x=${x.toFixed(2)}, y=${y.toFixed(2)} — input: "${userInput}"`);
      }
    });

    document.getElementById('prev-page').addEventListener('click', async () => {
      if (currentPage <= 1) return;
      currentPage--;
      await renderPage(currentPage);
    });

    document.getElementById('next-page').addEventListener('click', async () => {
      if (currentPage >= totalPages) return;
      currentPage++;
      await renderPage(currentPage);
    });


    async function renderPage(pageNum) {
      if (!pdfDoc) return;
      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: ctx, viewport }).promise;

      document.getElementById('page-info').innerText = `Page: ${pageNum} / ${totalPages}`;
    }


</script>
</body>
</html>
