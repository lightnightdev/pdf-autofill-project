<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PDF Batch Merge — index.html</title>
  <!--
    index.html
    Starter single-file app for: take PDF + CSV, position text on PDF preview, batch-generate PDFs.

    This file deliberately contains extensive comments so you can learn from it.
    It uses CDN libraries so it can be run offline only if you bundle the dependencies locally.

    Libraries included (via CDN links below):
      - pdf-lib (manipulate PDFs, flatten, embed fonts)
      - pdf.js (render PDF pages to canvas for visual preview)
      - PapaParse (CSV parsing)
      - Konva (canvas layer for draggable/resizable text boxes)
      - JSZip (optional: zip many outputs into one archive)
      - FileSaver (optional: trigger browser download for zip)

    Notes:
      - This file is a *starting skeleton*. It wires the UI, loads files, renders the PDF first page,
        and provides a Konva overlay with a draggable text box bound to the preview. The heavy
        batch generation logic is left as clear placeholders to implement next.

      - The code has lots of inline comments (as you requested) explaining every part and the
        exact next steps to implement.

    How to use locally:
      1) Save this file to disk as index.html.
      2) For local filesystem/Node features (writing many files without download prompts) you
         should wrap this in Electron/Tauri. For initial testing, opening in Chrome/Edge/Firefox
         will work but downloads will be via the browser "Save as" dialogs (we will zip to avoid
         multiple prompts).
  -->

  <style>
    /* Basic app layout styles */
    html,body{height:100%;margin:0;font-family:Inter, Roboto, Arial, sans-serif;background:#f6f7fb}
    .app{display:grid;grid-template-columns:320px 1fr 300px;gap:14px;height:100vh;padding:14px;box-sizing:border-box}
    .panel{background:#fff;border-radius:10px;padding:12px;box-shadow:0 2px 8px rgba(12,20,30,0.06);overflow:auto}
    .panel h2{margin:4px 0 12px;font-size:15px}

    /* Left: inputs */
    .file-input{display:flex;flex-direction:column;gap:8px}
    .file-row{display:flex;gap:8px;align-items:center}
    .file-row input[type=file]{flex:1}

    /* Middle: PDF preview */
    .preview-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
    #pdf-canvas{border:1px solid #ddd;max-width:100%;height:auto}
    /* Konva container sits exactly on top of canvas for interaction */
    #konva-container{position:absolute;left:0;top:0;pointer-events:none}

    /* Right: properties */
    .field{margin-bottom:8px}
    .btn{display:inline-block;padding:8px 12px;border-radius:6px;background:#2563eb;color:#fff;text-decoration:none;cursor:pointer}
    .btn.secondary{background:#e2e8f0;color:#0f172a}

    footer{display:flex;gap:8px;align-items:center;justify-content:space-between;padding-top:8px}
  </style>

  <!-- CDN libraries (you can pin versions or download them locally for offline use) -->
  <!-- pdf-lib: used to write and flatten PDFs -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
  <!-- pdf.js (rendering) - choose a version that matches your environment -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- PapaParse for CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <!-- Konva for canvas interactivity -->
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <!-- JSZip + FileSaver for packaging and downloading many files in single zip -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.0/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Left: Inputs and CSV preview -->
    <div class="panel">
      <h2>1) Files</h2>
      <div class="file-input">
        <div class="file-row">
          <label for="pdf-file">PDF:</label>
          <input id="pdf-file" type="file" accept="application/pdf" />
        </div>
        <div class="file-row">
          <label for="csv-file">CSV:</label>
          <input id="csv-file" type="file" accept="text/csv,text/plain" />
        </div>
        <div class="file-row">
          <button id="btn-load" class="btn">Load files</button>
          <button id="btn-flatten" class="btn secondary">Flatten PDF</button>
        </div>
      </div>

      <hr />

      <h2>CSV preview</h2>
      <!-- Mini-table that shows header + first row -->
      <div id="csv-preview"></div>

      <hr />

      <h2>Options</h2>
      <div class="field">
        <label><input id="opt-zip" type="checkbox" checked /> Download result as ZIP</label>
      </div>
      <div class="field">
        <label>Output filename column (first col used to name files):</label>
        <input id="col-name" type="text" placeholder="1 (first column)" />
      </div>

      <footer>
        <div>Ready</div>
        <div><small>v0.1</small></div>
      </footer>
    </div>

    <!-- Middle: PDF preview and Konva overlay -->
    <div class="panel preview-wrap" id="preview-panel">
      <h2>2) Preview & placement</h2>

      <!-- We render pdf.js canvas here -->
      <div id="page-container" style="position:relative">
        <canvas id="pdf-canvas"></canvas>
        <!-- Konva attaches to this div for the draggable layer. We'll size it in script -->
        <div id="konva-container"></div>
      </div>

      <div style="width:100%;display:flex;gap:8px;justify-content:center;margin-top:8px">
        <button id="btn-add-text" class="btn secondary">Add text box</button>
        <button id="btn-generate" class="btn">Generate PDFs (batch)</button>
      </div>

      <div style="margin-top:8px;font-size:13px;color:#334155">Tip: add a text box, pick which CSV column to bind to it on the right panel.</div>
    </div>

    <!-- Right: Text box properties and binding -->
    <div class="panel">
      <h2>3) Text box properties</h2>

      <div class="field">
        <label>Selected text (sample / binding):</label>
        <select id="csv-column-select"></select>
      </div>

      <div class="field">
        <label>Font size (pt):</label>
        <input id="font-size" type="number" value="18" />
      </div>

      <div class="field">
        <label>Font family:</label>
        <select id="font-family">
          <option>Helvetica</option>
          <option>Times-Roman</option>
          <option>Courier</option>
          <!-- You should add bundled/open fonts to /assets/fonts and allow choosing them here -->
        </select>
      </div>

      <div class="field">
        <label>Preview text:</label>
        <div id="sample-text" style="min-height:56px;border:1px dashed #e2e8f0;padding:8px;border-radius:6px"></div>
      </div>

      <div class="field">
        <label>Text box controls:</label>
        <div style="display:flex;gap:8px">
          <button id="btn-bring-front" class="btn secondary">Bring front</button>
          <button id="btn-delete" class="btn secondary">Delete box</button>
        </div>
      </div>

      <hr />
      <h2>Logs / progress</h2>
      <div id="log" style="font-family:monospace;font-size:12px;min-height:120px;overflow:auto;background:#0f172a;color:#fff;padding:8px;border-radius:6px"></div>
    </div>
  </div>

  <!-- Main application script (still a single file). The heavy lifting will be implemented here.
       Below we provide a working preview renderer hookup and a Konva overlay with a single draggable
       text box example. Batch-generation, font embedding, flattening, and full CSV-driven loops
       are provided as clearly marked TODOs so you can implement them next. -->
  <script>
    // Keep lots of comments here — you asked for them.

    // Globals used by the UI. In a production app you might encapsulate these in a class or module.
    const state = {
      pdfBytes: null,       // ArrayBuffer of the loaded PDF
      pdfDoc: null,         // pdf-lib PDFDocument (after parsing)
      pdfjsDoc: null,       // pdf.js loaded document
      currentPage: 1,       // which page we're previewing
      scale: 1.0,           // scale factor used to render canvas
      canvasSize: {w:0,h:0},
      konvaStage: null,
      konvaLayer: null,
      konvaTextNode: null,  // single text node for the demo — you'll support multiple
      csvData: null,        // array of objects from PapaParse
      csvHeaders: [],
    };

    // Utility: simple logger to the <div id="log"> area
    function log(msg) {
      const el = document.getElementById('log');
      const now = new Date().toLocaleTimeString();
      el.innerText = `${now} — ${msg}\n` + el.innerText;
    }

    // -------------------------- Basic setup --------------------------
    // Wire up buttons and inputs
    document.getElementById('btn-load').addEventListener('click', async () => {
      // When user clicks "Load files" we read the selected PDF and CSV and populate previews
      const pdfFile = document.getElementById('pdf-file').files[0];
      const csvFile = document.getElementById('csv-file').files[0];

      if (!pdfFile) { alert('Please select a PDF file first.'); return; }
      if (!csvFile) { alert('Please select a CSV file first.'); return; }

      log('Reading PDF...');
      state.pdfBytes = await pdfFile.arrayBuffer();

      // Load into pdf.js for rendering the preview
      await loadPdfJsDocument(state.pdfBytes);

      log('Reading CSV...');
      // Parse CSV with PapaParse (auto-detect header by default if first row has column names)
      Papa.parse(csvFile, {
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          state.csvData = results.data;
          state.csvHeaders = results.meta.fields || [];
          renderCsvPreview();
          populateCsvColumnSelect();
          log(`CSV parsed: ${state.csvData.length} rows, ${state.csvHeaders.length} columns`);
        },
        error: (err) => {
          console.error(err);
          log('CSV parse error: ' + err.message);
        }
      });

      // Also pre-load pdf-lib document because we'll need it later for generation
      // Note: pdf-lib works in browsers and Node. We create the pdf-lib PDFDocument from bytes.
      try {
        state.pdfDoc = await PDFLib.PDFDocument.load(state.pdfBytes);
        log('pdf-lib loaded PDF document');
      } catch (e) {
        console.error(e);
        log('pdf-lib failed to load PDF: ' + e.message);
      }
    });

    // Flatten button: this is a minimal example calling pdf-lib form-flattening.
    // NOTE: pdf-lib's built-in form flattening needs the document to have AcroForm fields.
    // If your flattening requirement means rasterizing, you'll use the "render page -> image -> new PDF" approach.
    document.getElementById('btn-flatten').addEventListener('click', async () => {
      if (!state.pdfDoc) { alert('Load a PDF first'); return; }
      try {
        // pdf-lib provides a form API
        const form = state.pdfDoc.getForm?.();
        if (form) {
          form.flatten();
          log('Form fields flattened (pdf-lib)');
        } else {
          log('No form found or pdf-lib getForm() not supported for this PDF.');
        }
        // Replace pdfBytes with the flattened version so subsequent operations use it
        const newBytes = await state.pdfDoc.save();
        state.pdfBytes = newBytes;
        // Reload pdf.js preview from flattened bytes so user sees the effect
        await loadPdfJsDocument(state.pdfBytes);
      } catch (e) {
        console.error(e);
        log('Flatten failed: ' + e.message);
      }
    });

    // Add text box button: creates a draggable Konva text node over the preview
    document.getElementById('btn-add-text').addEventListener('click', () => {
      if (!state.konvaStage) createKonvaOverlay();
      if (state.konvaTextNode) {
        alert('A text box already exists in this demo. Delete it first to add another.');
        return;
      }

      // Create a Konva.Text node — editable and draggable
      const text = new Konva.Text({
        x: 40,
        y: 40,
        text: 'Sample Text',
        fontSize: parseInt(document.getElementById('font-size').value, 10) || 18,
        fontFamily: document.getElementById('font-family').value || 'Helvetica',
        draggable: true,
      });

      // Enable pointer events on the Konva container so the text is interactive
      state.konvaStage.container().style.pointerEvents = 'auto';

      state.konvaLayer.add(text);
      state.konvaTextNode = text;
      state.konvaLayer.draw();

      // When user drags/resizes, update sample text preview (right panel)
      text.on('dragmove', () => updateSampleText());
      text.on('transform', () => updateSampleText());

      updateSampleText();
    });

    // Delete box
    document.getElementById('btn-delete').addEventListener('click', () => {
      if (!state.konvaTextNode) return;
      state.konvaTextNode.destroy();
      state.konvaTextNode = null;
      state.konvaLayer.draw();
      state.konvaStage.container().style.pointerEvents = 'none';
      updateSampleText();
    });

    // Bring front
    document.getElementById('btn-bring-front').addEventListener('click', () => {
      if (!state.konvaTextNode) return;
      state.konvaTextNode.moveToTop();
      state.konvaLayer.draw();
    });

    // Update font size input to reflect selected text size
    document.getElementById('font-size').addEventListener('input', (e) => {
      const v = parseInt(e.target.value, 10) || 18;
      if (state.konvaTextNode) {
        state.konvaTextNode.fontSize(v);
        state.konvaLayer.draw();
      }
      updateSampleText();
    });

    // CSV column select changed -> update sample
    document.getElementById('csv-column-select').addEventListener('change', () => updateSampleText());

    // Generate PDFs button: placeholder. In the next iteration you'll implement the full loop that:
    //  - iterates CSV rows
    //  - clones the template PDF for each row
    //  - embeds a font
    //  - draws the text at the converted PDF coordinates
    //  - saves result bytes and either zips them or saves to disk
    document.getElementById('btn-generate').addEventListener('click', async () => {
      if (!state.csvData || state.csvData.length === 0) { alert('Load CSV first'); return; }
      if (!state.konvaTextNode) { alert('Add and position at least one text box'); return; }

      // Gather the text-box metadata that we will need for insertion into pdf-lib
      // We must convert Konva (pixel) coordinates back into PDF points using the same scale used when rendering.
      const pageDims = state.canvasSize; // pixels used for canvas rendering
      const pdfPage = await state.pdfjsDoc.getPage(state.currentPage);
      const pdfWidthPts = pdfPage.view[2];
      const pdfHeightPts = pdfPage.view[3];

      // Example conversion (documented in comments below):
      // pdfPointX = (konvaX / canvasPixelWidth) * pdfPageWidthPoints
      // pdfPointY = pdfPageHeightPoints - (konvaY / canvasPixelHeight) * pdfPageHeightPoints
      // Note: pdf coordinate origin is bottom-left; canvas origin is top-left.

      // TODO: Implement the full batch generation logic here using pdf-lib.
      alert('Batch generation not implemented in this skeleton. See TODOs in the source.');
    });

    // -------------------------- PDF.js rendering & Konva overlay --------------------------
    async function loadPdfJsDocument(bytes) {
      // Remove previous Konva stage so we recreate a correctly sized one.
      if (state.konvaStage) {
        state.konvaStage.destroy();
        state.konvaStage = null;
        state.konvaLayer = null;
        state.konvaTextNode = null;
      }

      const uint8 = new Uint8Array(bytes);
      const loadingTask = pdfjsLib.getDocument({ data: uint8 });
      state.pdfjsDoc = await loadingTask.promise;

      const page = await state.pdfjsDoc.getPage(1);
      state.currentPage = 1;

      // Get raw viewport at scale 1 to know intrinsic PDF page size (in points)
      const origViewport = page.getViewport({ scale: 1 });

      // Choose available width from the preview column (the panel), not just the inner container.
      // 'preview-panel' is the parent panel of page-container; use it so we fit the visible area.
      const previewPanel = document.getElementById('preview-panel');
      // subtract some padding to avoid overflowing
      const availableWidth = Math.max(200, previewPanel.clientWidth - 36);

      // Compute a scale that will fit the PDF page into availableWidth.
      // We allow larger zooms (maxScale) so the preview is comfortable on big screens.
      const maxScale = 2.5; // increase if you want even bigger preview
      const targetScale = Math.min(maxScale, availableWidth / origViewport.width);

      state.scale = targetScale;
      const viewport = page.getViewport({ scale: targetScale });

      // Device pixel ratio handling for crisp rendering on HiDPI screens:
      const dpr = window.devicePixelRatio || 1;

      // Set the CSS display size (what the user sees) to viewport width/height (in px).
      const canvas = document.getElementById('pdf-canvas');
      const context = canvas.getContext('2d');

      // Physical pixel size should be CSS size * DPR
      canvas.style.width = Math.round(viewport.width) + 'px';
      canvas.style.height = Math.round(viewport.height) + 'px';
      canvas.width = Math.round(viewport.width * dpr);
      canvas.height = Math.round(viewport.height * dpr);

      // scale the context so drawing operations map to CSS pixels
      context.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Save canvas pixel dimensions for coordinate mapping (use CSS pixel dims)
      state.canvasSize.w = Math.round(viewport.width);
      state.canvasSize.h = Math.round(viewport.height);

      // Render using the scaled viewport (pdf.js will render at the right size)
      await page.render({ canvasContext: context, viewport }).promise;

      // Now size the Konva overlay to match the *CSS* size (not the DPR pixels).
      createKonvaOverlay(); // will size it based on state.canvasSize

      // If Konva stage exists, force update to ensure everything aligns.
      if (state.konvaStage) {
        state.konvaStage.width(state.canvasSize.w);
        state.konvaStage.height(state.canvasSize.h);
        // Also make sure the HTML container for Konva matches the CSS pixel size
        const konvaContainer = document.getElementById('konva-container');
        konvaContainer.style.width = state.canvasSize.w + 'px';
        konvaContainer.style.height = state.canvasSize.h + 'px';
        state.konvaStage.draw();
      }

      log(`Rendered page 1 at ${state.canvasSize.w}×${state.canvasSize.h} CSS pixels (scale=${targetScale.toFixed(2)}, dpr=${dpr})`);
    }


    function createKonvaOverlay() {
      const canvas = document.getElementById('pdf-canvas');
      const container = document.getElementById('konva-container');

      container.innerHTML = '';
      container.style.width = state.canvasSize.w + 'px';
      container.style.height = state.canvasSize.h + 'px';
      container.style.left = canvas.offsetLeft + 'px';
      container.style.top = canvas.offsetTop + 'px';
      container.style.pointerEvents = 'none'; // stays off until a text box is added

      const stage = new Konva.Stage({
        container: container,
        width: state.canvasSize.w,
        height: state.canvasSize.h,
      });
      const layer = new Konva.Layer();
      stage.add(layer);

      // optional: guide rect
      const rect = new Konva.Rect({
        x: 0, y: 0, width: state.canvasSize.w, height: state.canvasSize.h,
        stroke: '#94a3b8', strokeWidth: 0, dash: [4,4],
      });
      layer.add(rect);
      layer.draw();

      state.konvaStage = stage;
      state.konvaLayer = layer;
    }


    // Update the right-panel sample text from selected CSV column and the Konva text node
    function updateSampleText() {
      const sampleEl = document.getElementById('sample-text');
      if (!state.konvaTextNode) { sampleEl.innerText = '(no text box)'; return; }

      // Get selected CSV column header
      const sel = document.getElementById('csv-column-select').value;
      let sampleVal = '';
      if (state.csvData && state.csvData.length > 0) {
        // fallback: if header missing use the first column's value
        if (sel && sel !== '__none__') sampleVal = state.csvData[0][sel] || '';
        else sampleVal = Object.values(state.csvData[0])[0] || '';
      }

      // Compose preview from text node and the bound sample value
      sampleEl.innerText = `Text box: "${state.konvaTextNode.text()}"\nBound to: ${sel}\nSample value: ${sampleVal}`;
    }

    // Render small table showing csv headers + first row values
    function renderCsvPreview() {
      const div = document.getElementById('csv-preview');
      div.innerHTML = '';
      if (!state.csvData) { div.innerText = 'No CSV loaded.'; return; }
      const hdrs = state.csvHeaders.length ? state.csvHeaders : Object.keys(state.csvData[0] || {});
      const row = state.csvData[0] || {};

      const table = document.createElement('table');
      table.style.width = '100%';
      table.style.borderCollapse = 'collapse';

      const trh = document.createElement('tr');
      hdrs.forEach(h => {
        const th = document.createElement('th'); th.innerText = h; th.style.borderBottom = '1px solid #e2e8f0'; th.style.textAlign='left'; th.style.padding='4px';
        trh.appendChild(th);
      });
      table.appendChild(trh);

      const tr = document.createElement('tr');
      hdrs.forEach(h => {
        const td = document.createElement('td'); td.innerText = row[h] || ''; td.style.padding='4px';
        tr.appendChild(td);
      });
      table.appendChild(tr);

      div.appendChild(table);
    }

    function populateCsvColumnSelect() {
      const sel = document.getElementById('csv-column-select');
      sel.innerHTML = '';
      const optNone = document.createElement('option'); optNone.value='__none__'; optNone.text='(first column)'; sel.appendChild(optNone);
      (state.csvHeaders || []).forEach(h => {
        const o = document.createElement('option'); o.value=h; o.text=h; sel.appendChild(o);
      });
    }

    // Additional helpers / TODOs are intentionally left in the file near where they will be implemented:
    // - convertKonvaToPdfCoords(konvaX,konvaY) => {x:y:}
    // - embedFontAndDrawText(pdfDoc, pageIndex, text, xPts, yPts, fontName, fontSizePts)
    // - batchProcessRows(csvData, templatePdfBytes, mapping, outputAsZip)
    // - textWrapping logic using font metrics (fontkit/pdf-lib)

    // End of main script
  </script>
</body>
</html>
