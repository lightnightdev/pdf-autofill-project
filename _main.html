<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Batch Merge v0.1</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Bootstrap  -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Quick Styles -->
  <style>

  </style>

</head>

<body>

  <div class="layout">

    <aside class="sidebar left">
      <h1>PDF-CSV Autofiller</h1>
      <span id="webapp_version_id">v1.2</span>
      <h2>Select Files</h2>
      <div class="file-input">
        <div class="file-row">
          <label for="pdf-file">PDF:</label>
          <input id="pdf-file" type="file" accept="application/pdf" />
        </div>
        <div class="file-row">
          <label for="csv-file">CSV:</label>
          <input id="csv-file" type="file" accept="text/csv,text/plain" />
        </div>
      </div>

      <br>
      <hr><br>

      <h2>PDF Navigation</h2>
      <div id="pdf-page-info">
        <span id="page-info">Page 0 / 0</span>
      </div>
      <div id="pdf-page-buttons"><br>
        <button id="prev-page" class="btn btn-secondary btn-sm">Previous Page</button>
        <button id="next-page" class="btn btn-secondary btn-sm">Next Page</button>
      </div>

      <div class="text-center mt-5">
        <button id="btn-clear-loc" class="btn btn-danger m-2" type="button" onclick="removePage()">
          <i class="bi bi-trash"></i> Remove Current Page
        </button>
      </div>

      <br>
      <hr><br>


      <div>
        <button id="btn-clear-loc" class="btn btn-danger m-2" type="button" onclick="clearAllLocData()">
          <i class="bi bi-trash"></i> Clear All Markers
        </button>

        <button id="btn-make-pdfs" class="btn btn-success m-2" type="button" onclick="generateAndExportPDFs()">
          Generate PDFs
        </button>
      </div>

      <br>
      <hr><br>
      <div id="logbox" class="logbox"></div>

    </aside>

    <!-- Main PDF Display -->
    <div class="wrapper">
      <main class="content">
        <div id="pdf-stage" style="position:relative; display:inline-block;">
          <canvas id="pdf-canvas"></canvas>
          <div id="pdf-overlay" style="position:absolute; left:0; top:0; pointer-events:none;"></div>
        </div>
      </main>
    </div>

    <aside class="sidebar right">
      <h2>Select Columns</h2>
      <div class="">
        <!-- Controls column -->
        <div class="">
          <div class="d-flex align-items-center m-2">
            <label for="font-select" class="form-label mb-0">Font:</label>
            <select id="font-select" class="form-select form-select-sm">
              <option value="_normal">Normal</option>
              <option value="_monospace">Monospace</option>
              <option value="_signature">Signature</option>
            </select>
          </div>

          <div class="d-flex align-items-center m-2">
            <label for="size-select" class="form-label mb-0">Size:</label>
            <input type="number" class="form-control" id="size-select" placeholder="12">
          </div>

          <div class="d-flex align-items-center m-2">
            <label for="spacing-select" class="form-label mb-0">Spacing:</label>
            <input type="number" class="form-control" id="spacing-select" placeholder="0">
          </div>
        </div>

        <!-- Table column -->
        <div class="">
          <div class="table-responsive">
            <div id="csv-cards" class="d-flex flex-column gap-2">
            </div>
          </div>

        </div>

    </aside>

  </div>

  <!-- Libraries -->

  <!-- pdf-lib: used to write and flatten PDFs -->

  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  </script>
  <!-- PapaParse for CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <!-- My Dependencies -->
  <script src="js/utils.js"></script>
  <script src="js/log.js"></script>
  <script src="js/pdfloader.js"></script>
  <script src="js/csvloader.js"></script>
  <script src="js/db.js"></script>
  <script src="js/markers.js"></script>
  <script src="js/pdfexport.js"></script>

  <!-- Startup Script -->
  <script src="js/_startup.js"></script>

</body>

</html>
