<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button id="generate">Generate Symbol Font PDF</button>


    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <script>
        document.getElementById('generate').addEventListener('click', async () => {
            const { PDFDocument, StandardFonts, rgb } = PDFLib;

            const pdfDoc = await PDFDocument.create();
            const page = pdfDoc.addPage([600, 800]);

            const symbolFont = await pdfDoc.embedFont(StandardFonts.Symbol);
            const fontSize = 18;
            const yStart = 760;

            // Create a string of all printable ASCII characters (32–126)
            let output = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

            page.drawText(output, {
                x: 50,
                y: yStart,
                size: fontSize,
                font: symbolFont,
                color: rgb(0, 0, 0),
                lineHeight: fontSize + 4,
            });

            const pdfBytes = await pdfDoc.save();

            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'symbol-font-preview.pdf';
            link.click();
            URL.revokeObjectURL(url);
        });
    </script>

</body>

</html>
